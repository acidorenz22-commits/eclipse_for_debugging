spring.application.name=SpringBootWeb-DIT-1
spring.datasource.url=jdbc:mysql://localhost:3306/springbootweb_dit1?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=root1234

spring.jpa.show-sql=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# spring.jpa.show-sql=true

# --- Log SQL through the logging framework (Log4j2) ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.jpa.properties.hibernate.format_sql=true

# --- Log file ---
logging.file.name=logs/app.log
logging.level.root=DEBUG
logging.level.com.yourcompany=DEBUG